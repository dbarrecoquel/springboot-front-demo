<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <!-- Fragment pour une tuile produit -->
    <div th:fragment="product-tile(product)" class="col">
        <div class="card product-card h-100">
            <a th:href="@{/catalog/{id}(id=${product.id})}" class="text-decoration-none text-dark">
                <div class="product-image">
                    <span th:text="${product.name.substring(0, 1)}">P</span>
                    <div class="product-badge" th:text="${product.sku}">SKU</div>
                </div>
                <div class="card-body">
                    <h5 class="product-title" th:text="${product.name}">Product Name</h5>
                    <p class="product-description" th:text="${product.description}">Product description</p>
                    
                    <div class="product-price mb-3">
                        $<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span>
                    </div>
                </div>
            </a>
            <div class="card-footer bg-white border-0">
                <form th:action="@{/basket/add}" method="post" onclick="event.stopPropagation();">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="btn btn-add-to-cart w-100">
                        <i class="bi bi-cart-plus"></i> Ajouter au panier
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
