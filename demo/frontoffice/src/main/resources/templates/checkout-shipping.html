<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Méthode de Livraison - E-Commerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar(${rootCategories})}"></div>

    <div class="container mt-5 mb-5">
        <!-- Progress bar -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="progress" style="height: 3px;">
                    <div class="progress-bar bg-primary" role="progressbar" style="width: 75%"></div>
                </div>
                <div class="d-flex justify-content-between mt-2">
                    <span class="text-muted"><i class="bi bi-cart-check"></i> Panier</span>
                    <span class="text-muted"><i class="bi bi-geo-alt"></i> Adresses</span>
                    <span class="text-primary fw-bold"><i class="bi bi-truck"></i> Livraison</span>
                    <span class="text-muted"><i class="bi bi-credit-card"></i> Paiement</span>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/checkout/shipping}" method="post">
            <div class="row">
                <!-- Méthodes de livraison -->
                <div class="col-md-8">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5><i class="bi bi-truck"></i> Choisir une méthode de livraison</h5>
                            <small>Livraison vers: <span th:text="${shippingAddress.country}">France</span></small>
                        </div>
                        <div class="card-body">
                            <div th:if="${#lists.isEmpty(shippingMethods)}" class="text-center py-4">
                                <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                                <p class="mt-3">Aucune méthode de livraison disponible pour votre pays</p>
                            </div>

                            <div th:each="method : ${shippingMethods}" class="form-check mb-3 p-3 border rounded">
                                <input class="form-check-input" type="radio" 
                                       name="shippingMethodId" 
                                       th:id="'method-' + ${method.id}"
                                       th:value="${method.id}"
                                       th:checked="${method.id == selectedShippingMethodId}"
                                       required
                                       onchange="updateShippingCost()">
                                <label class="form-check-label w-100" th:for="'method-' + ${method.id}">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h6 class="mb-1" th:text="${method.name}">Standard</h6>
                                            <p class="mb-1 text-muted small" th:text="${method.description}">Description</p>
                                            <small class="text-muted">
                                                <i class="bi bi-clock"></i> 
                                                Délai: <span th:text="${method.estimatedDays}">3</span> jours
                                            </small>
                                        </div>
                                        <div class="text-end">
                                            <strong class="text-primary" 
                                                    th:text="${method.cost == 0} ? 'GRATUIT' : ${#numbers.formatDecimal(method.cost, 1, 2)} + ' €'">
                                                5.99 €
                                            </strong>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Résumé -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="bi bi-receipt"></i> Résumé</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Sous-total</span>
                                <span th:text="${#numbers.formatDecimal(subtotal, 1, 2)} + ' €'">0.00 €</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Livraison</span>
                                <span id="shipping-cost-display" 
                                      th:text="${shippingCost > 0} ? ${#numbers.formatDecimal(shippingCost, 1, 2)} + ' €' : 'Gratuit'">
                                    0.00 €
                                </span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Total</span>
                                <span id="total-display" th:text="${#numbers.formatDecimal(total, 1, 2)} + ' €'">0.00 €</span>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary btn-lg"
                                th:disabled="${#lists.isEmpty(shippingMethods)}">
                            <i class="bi bi-arrow-right-circle"></i> Continuer
                        </button>
                        <a href="/checkout/addresses" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left-circle"></i> Retour
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
    /*<![CDATA[*/
    const shippingMethods = /*[[${shippingMethods}]]*/ [];
    const subtotal = /*[[${subtotal}]]*/ 0;

    function updateShippingCost() {
        const selectedRadio = document.querySelector('input[name="shippingMethodId"]:checked');
        if (!selectedRadio) return;

        const selectedId = parseInt(selectedRadio.value);
        const method = shippingMethods.find(m => m.id === selectedId);

        if (method) {
            const shippingCost = method.cost;
            const total = subtotal + shippingCost;

            document.getElementById('shipping-cost-display').textContent = 
                shippingCost === 0 ? 'Gratuit' : shippingCost.toFixed(2) + ' €';
            
            document.getElementById('total-display').textContent = total.toFixed(2) + ' €';
        }
    }
    /*]]>*/
    </script>
</body>
</html>
