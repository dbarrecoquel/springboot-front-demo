<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livraison - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f7fafc; }
        
        .delivery-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .delivery-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        .delivery-card.selected {
            border-color: #667eea;
            background-color: #f0f4ff;
        }
        
        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    
    
    <div th:replace="~{fragments/navbar :: navbar(${rootCategories})}"></div>
    <div class="container my-5">
         <div class="row mb-4">
            <div class="col-12">
                <div class="progress" style="height: 3px;">
                    <div class="progress-bar bg-primary" role="progressbar" style="width: 75%"></div>
                </div>
                <div class="d-flex justify-content-between mt-2">
                    <span class="text-muted"><i class="bi bi-cart-check"></i> Panier</span>
                    <span class="text-muted"><i class="bi bi-geo-alt"></i> Adresses</span>
                    <span class="text-primary fw-bold"><i class="bi bi-truck"></i> Livraison</span>
                    <span class="text-muted"><i class="bi bi-credit-card"></i> Paiement</span>
                </div>
            </div>
        </div>
        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i> [[${success}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i> [[${error}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div class="row">
            
            <!-- Main Content -->
            <div class="col-lg-8">
                
                <h2 class="mb-4">
                    <i class="bi bi-truck"></i> Mode de Livraison
                </h2>
                
                <!-- Info entrepôt -->
                <div class="alert alert-light border mb-4">
                    <strong><i class="bi bi-building"></i> Départ</strong>
                    <br>
                    <span th:text="${warehouse.name}"></span> - <span th:text="${warehouse.code}"></span>
                </div>
                
                <!-- Formulaire -->
                <form id="shippingForm" action="/checkout/shipping" method="post">
                    <input type="hidden" name="_csrf" 
           				th:value="${_csrf.token}" />
                    <!-- Input hidden pour carrier service id -->
                    <input type="hidden" name="carrierServiceId" id="carrierServiceId" value="">
                    
                    <!-- Message si aucune option -->
                    <div th:if="${deliveryEstimates == null or deliveryEstimates.isEmpty()}" class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        Aucun mode de livraison disponible pour cette destination.
                    </div>
                    
                    <!-- Cartes de livraison -->
                    <div th:each="estimate : ${deliveryEstimates}" class="delivery-card mb-3">
                        
                        <!-- Entête -->
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="flex-grow-1">
                                <h5 class="mb-1">
                                    <strong th:text="${estimate.serviceName}"></strong>
                                </h5>
                                <small class="text-muted" th:text="${estimate.carrierName}"></small>
                                <div th:if="${estimate.serviceDescription}" class="text-muted small mt-1">
                                    <span th:text="${estimate.serviceDescription}"></span>
                                </div>
                            </div>
                            
                            <!-- Prix -->
                            <div class="ms-3 text-end">
                                <strong th:if="${estimate.freeShipping == true}" class="text-success">GRATUIT</strong>
                                <strong th:unless="${estimate.freeShipping == true}" class="text-primary">
                                    <span th:text="${#numbers.formatDecimal(estimate.cost, 1, 2)}"></span>€
                                </strong>
                            </div>
                        </div>
                        
                        <!-- Détails livraison -->
                        <div class="border-top pt-3 small text-muted">
                            <div class="row">
                                <div class="col-md-6">
                                    <i class="bi bi-calendar-event"></i>
                                    Livraison entre
                                    <br>
                                    <strong th:text="${#temporals.format(estimate.earliestDeliveryDate, 'dd/MM/yyyy')}"></strong>
                                    et
                                    <strong th:text="${#temporals.format(estimate.latestDeliveryDate, 'dd/MM/yyyy')}"></strong>
                                </div>
                                <div class="col-md-6" th:if="${estimate.estimatedDays}">
                                    <i class="bi bi-hourglass"></i>
                                    Environ <strong th:text="${estimate.estimatedDays}"></strong> jour(s)
                                </div>
                            </div>
                            <div th:if="${estimate.processingInfo}" class="mt-2">
                                <small th:text="${estimate.processingInfo}"></small>
                            </div>
                        </div>
                        
                        <!-- Input caché pour récupérer l'ID -->
                        <input type="hidden" class="carrier-id" th:value="${estimate.carrierServiceId}">
                    </div>
                    
                    <!-- Boutons d'action -->
                    <div class="d-flex gap-3 mt-5">
                        <a href="/checkout/addresses" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                        <button type="submit" class="btn btn-success btn-lg flex-grow-1"
                                th:disabled="${deliveryEstimates == null or deliveryEstimates.isEmpty()}">
                            Continuer vers le paiement
                            <i class="bi bi-check-circle"></i>
                        </button>
                    </div>
                    
                </form>
                
            </div>
            
            <!-- Sidebar - Order Summary -->
            <div class="col-lg-4">
                <div class="summary-card">
                    <h5 class="mb-4">
                        <i class="bi bi-receipt"></i> Résumé Final
                    </h5>
                    
                    <!-- Articles -->
                    <div class="mb-3 pb-3 border-bottom">
                        <small class="text-muted d-block mb-2"><strong>Articles</strong></small>
                        <div th:each="item : ${items}" class="d-flex justify-content-between mb-2 small">
                            <div>
                                <strong th:text="${item.product.name}"></strong>
                                <div class="text-muted">
                                    Qté: <span th:text="${item.quantity}"></span> × <span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></span>€
                                </div>
                            </div>
                            <span th:text="${#numbers.formatDecimal(item.quantity * item.unitPrice, 1, 2)} + '€'"></span>
                        </div>
                    </div>
                    
                    <!-- Totaux -->
                    <div class="mb-2 small">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Sous-total</span>
                            <span th:text="${#numbers.formatDecimal(subtotal, 1, 2)} + '€'"></span>
                        </div>
                        
                        <!-- ✅ TAXES -->
                        <div class="d-flex justify-content-between mb-2">
                            <span>Taxes (20%)</span>
                            <span th:text="${#numbers.formatDecimal(tax, 1, 2)} + '€'"></span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-3 pb-2 border-bottom">
                            <span>Livraison</span>
                            <span id="selectedDeliveryInfo" class="text-muted">-</span>
                        </div>
                    </div>
                    
                    <!-- TOTAL TTC -->
                    <div class="d-flex justify-content-between p-3 bg-light rounded">
                        <strong>TOTAL TTC</strong>
                        <strong class="text-primary" th:text="${#numbers.formatDecimal(total, 1, 2)} + '€'"></strong>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('shippingForm');
            const carrierServiceIdInput = document.getElementById('carrierServiceId');
            const deliveryCards = document.querySelectorAll('.delivery-card');
            
            // Sélectionner la première carte par défaut
            if (deliveryCards.length > 0) {
                selectDeliveryCard(deliveryCards[0]);
            }
            
            // Ajouter event listeners à chaque carte
            deliveryCards.forEach(card => {
                card.addEventListener('click', function() {
                    selectDeliveryCard(this);
                });
            });
            
            // Valider avant soumission
            form.addEventListener('submit', function(e) {
                const carrierServiceId = carrierServiceIdInput.value;
                
                if (!carrierServiceId || carrierServiceId.trim() === '') {
                    e.preventDefault();
                    alert('Veuillez selectionner un mode de livraison');
                    return false;
                }
                
                return true;
            });
            
            function selectDeliveryCard(card) {
                const carrierServiceId = card.querySelector('.carrier-id').value;
                carrierServiceIdInput.value = carrierServiceId;
                
                deliveryCards.forEach(c => {
                    c.classList.remove('selected');
                });
                card.classList.add('selected');
                
                updateDeliveryInfo(card);
            }
            
            function updateDeliveryInfo(card) {
                const cost = card.querySelector('.text-primary, .text-success');
                const infoElement = document.getElementById('selectedDeliveryInfo');
                
                if (cost) {
                    infoElement.innerHTML = cost.textContent;
                } else {
                    infoElement.textContent = '-';
                }
            }
        });
    </script>
</body>
</html>
