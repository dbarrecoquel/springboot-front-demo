<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Catalog - E-Commerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- Include navbar -->
    <div th:replace="~{fragments/navbar :: navbar(rootCategories=${rootCategories})}"></div>

    <!-- Hero Banner -->
    <div class="hero-banner">
        <div class="container text-center">
            <h1><i class="bi bi-box-seam"></i> Product Catalog</h1>
            <p>Discover our amazing collection of products</p>
        </div>
    </div>

    <!-- Catalog Section -->
    <div class="catalog-container">
        <div class="container">
            <!-- Catalog Header -->
            <div class="catalog-header">
                <div>
                    <h2>All Products</h2>
                    <p class="product-count mb-0">
                        <span th:text="${#lists.size(products)}">0</span> products available
                    </p>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" placeholder="Search products...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option>Sort by: Featured</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                            <option>Name: A to Z</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-secondary active">
                                <i class="bi bi-grid-3x3-gap"></i> Grid
                            </button>
                            <button type="button" class="btn btn-outline-secondary">
                                <i class="bi bi-list"></i> List
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Product Grid using fragment -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" th:if="${!#lists.isEmpty(products)}">
                <th:block th:each="product : ${products}">
                    <div th:replace="~{fragments/product-tile :: product-tile(${product})}"></div>
                </th:block>
            </div>

            <!-- Empty State -->
            <div class="empty-state" th:if="${#lists.isEmpty(products)}">
                <i class="bi bi-inbox"></i>
                <h3>No Products Available</h3>
                <p class="text-muted">Check back soon for new products</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 E-Commerce Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
