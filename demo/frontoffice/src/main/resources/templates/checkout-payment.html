<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paiement - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f7fafc; }
        
        .payment-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .payment-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        .payment-card.selected {
            border-color: #667eea;
            background-color: #f0f4ff;
        }
        
        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    
    <!-- Progress Bar -->
    
    <div th:replace="~{fragments/navbar :: navbar(${rootCategories})}"></div>
    
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-12">
                <div class="progress" style="height: 3px;">
                    <div class="progress-bar bg-primary" role="progressbar" style="width: 100%"></div>
                </div>
                <div class="d-flex justify-content-between mt-2">
                    <span class="text-muted"><i class="bi bi-cart-check"></i> Panier</span>
                    <span class="text-muted"><i class="bi bi-geo-alt"></i> Adresses</span>
                    <span class="text-muted"><i class="bi bi-truck"></i> Livraison</span>
                    <span class="text-primary fw-bold"><i class="bi bi-credit-card"></i> Paiement</span>
                </div>
            </div>
        </div>
        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i> [[${success}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i> [[${error}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div class="row">
            
            <!-- Main Content -->
            <div class="col-lg-8">
                
                <h2 class="mb-4">
                    <i class="bi bi-credit-card"></i> Méthode de Paiement
                </h2>
                
                <!-- Formulaire -->
                <form id="paymentForm" action="/checkout/payment/confirm" method="post">
                    <input type="hidden" name="_csrf" 
           				th:value="${_csrf.token}" />
                    <!-- Input hidden pour payment method id -->
                    <input type="hidden" name="paymentMethodId" id="paymentMethodId" value="">
                    
                    <!-- Message si aucune option -->
                    <div th:if="${paymentMethods == null or paymentMethods.isEmpty()}" class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        Aucune méthode de paiement disponible.
                    </div>
                    
                    <!-- Cartes de paiement -->
                    <div th:each="method : ${paymentMethods}" class="payment-card mb-3">
                        
                        <!-- Entête -->
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h5 class="mb-1">
                                    <i th:if="${method.type == 'COD'}" class="bi bi-cash-coin text-warning"></i>
                                    <i th:if="${method.type == 'CREDIT_CARD'}" class="bi bi-credit-card text-primary"></i>
                                    <i th:if="${method.type == 'PAYPAL'}" class="bi bi-wallet2 text-info"></i>
                                    <strong th:text="${method.name}"></strong>
                                </h5>
                                <p class="text-muted mb-0" th:text="${method.description}"></p>
                            </div>
                        </div>
                        
                        <!-- Input caché pour récupérer l'ID -->
                        <input type="hidden" class="payment-method-id" th:value="${method.id}">
                    </div>
                    
                    <!-- Boutons d'action -->
                    <div class="d-flex gap-3 mt-5">
                        <a href="/checkout/shipping" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                        <button type="submit" class="btn btn-success btn-lg flex-grow-1"
                                th:disabled="${paymentMethods == null or paymentMethods.isEmpty()}">
                            Confirmer la commande
                            <i class="bi bi-check-circle"></i>
                        </button>
                    </div>
                    
                </form>
                
            </div>
            
            <!-- Sidebar - Order Summary -->
            <div class="col-lg-4">
                <div class="summary-card">
                    <h5 class="mb-4">
                        <i class="bi bi-receipt"></i> Résumé Final
                    </h5>
                    
                    <!-- Articles -->
                    <div class="mb-3 pb-3 border-bottom">
                        <small class="text-muted d-block mb-2"><strong>Articles</strong></small>
                        <div th:each="item : ${items}" class="d-flex justify-content-between mb-2 small">
                            <div>
                                <strong th:text="${item.product.name}"></strong>
                                <div class="text-muted">
                                    Qté: <span th:text="${item.quantity}"></span> × <span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></span>€
                                </div>
                            </div>
                            <span th:text="${#numbers.formatDecimal(item.quantity * item.unitPrice, 1, 2)} + '€' "></span>
                        </div>
                    </div>
                    
                    <!-- Totaux -->
                    <div class="mb-2 small">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Sous-total</span>
                            <span th:text="${#numbers.formatDecimal(subtotal, 1, 2)} + '€' "></span>
                        </div>
                        
                        <!-- ✅ TAXES -->
                        <div class="d-flex justify-content-between mb-2">
                            <span>Taxes (20%)</span>
                            <span th:text="${#numbers.formatDecimal(tax, 1, 2)} + '€' "></span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-3 pb-2 border-bottom">
                            <span>Livraison</span>
                            <span th:text="${#numbers.formatDecimal(shippingCost, 1, 2)} + '€' "></span>
                        </div>
                    </div>
                    
                    <!-- TOTAL TTC -->
                    <div class="d-flex justify-content-between p-3 bg-light rounded">
                        <strong>TOTAL TTC</strong>
                        <strong class="text-primary" th:text="${#numbers.formatDecimal(total, 1, 2)} + '€'"></strong>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('paymentForm');
            const paymentMethodIdInput = document.getElementById('paymentMethodId');
            const paymentCards = document.querySelectorAll('.payment-card');
            
            // Sélectionner la première carte par défaut
            if (paymentCards.length > 0) {
                selectPaymentCard(paymentCards[0]);
            }
            
            // Ajouter event listeners à chaque carte
            paymentCards.forEach(card => {
                card.addEventListener('click', function() {
                    selectPaymentCard(this);
                });
            });
            
            // Valider avant soumission
            form.addEventListener('submit', function(e) {
                const paymentMethodId = paymentMethodIdInput.value;
                
                if (!paymentMethodId || paymentMethodId.trim() === '') {
                    e.preventDefault();
                    alert('Veuillez selectionner une méthode de paiement');
                    return false;
                }
                
                return true;
            });
            
            function selectPaymentCard(card) {
                const paymentMethodId = card.querySelector('.payment-method-id').value;
                paymentMethodIdInput.value = paymentMethodId;
                
                paymentCards.forEach(c => {
                    c.classList.remove('selected');
                });
                card.classList.add('selected');
            }
        });
    </script>
</body>
</html>
