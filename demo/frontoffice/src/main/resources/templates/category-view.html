<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${category.name} + ' - E-Commerce Store'">Catégorie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	 <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- Navigation Menu -->
    <!-- Remplacer la navbar existante par : -->
	<!-- Remplacer la navbar existante par : -->
<div th:replace="~{fragments/navbar :: navbar(${rootCategories})}"></div>
    <!-- Breadcrumb -->
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                <li class="breadcrumb-item" th:each="crumb, iterStat : ${breadcrumb}" 
                    th:classappend="${iterStat.last} ? 'active' : ''">
                    <a th:if="${!iterStat.last}" th:href="@{/category/{id}(id=${crumb.id})}" 
                       th:text="${crumb.name}"></a>
                    <span th:if="${iterStat.last}" th:text="${crumb.name}"></span>
                </li>
            </ol>
        </nav>
    </div>

    <!-- Category Header -->
    <div class="category-header">
        <div class="container text-center">
            <h1 class="display-4 fw-bold" th:text="${category.name}">Catégorie</h1>
            <p class="lead" th:text="${category.description}">Description de la catégorie</p>
        </div>
    </div>

    <div class="container mb-5">
        <!-- Sous-catégories -->
        <div th:if="${!#lists.isEmpty(subCategories)}" class="mb-5">
            <h3 class="mb-4">
                <i class="bi bi-folder"></i> Sous-catégories
            </h3>
            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div class="col" th:each="subCategory : ${subCategories}">
                    <a th:href="@{/category/{id}(id=${subCategory.id})}" class="text-decoration-none">
                        <div class="subcategory-card">
                            <div class="subcategory-icon">
                                <span th:text="${subCategory.name.substring(0, 1)}">S</span>
                            </div>
                            <h5 th:text="${subCategory.name}">Sous-catégorie</h5>
                            <p class="text-muted small" th:text="${subCategory.description}">Description</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Produits de cette catégorie -->
       <!-- Produits de cette catégorie -->
		<div th:if="${!#lists.isEmpty(products)}">
		    <h3 class="mb-4">
		        <i class="bi bi-box-seam"></i> Produits 
		        <span class="badge bg-primary" th:text="${#lists.size(products)}">0</span>
		    </h3>
		    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
		        <th:block th:each="product : ${products}">
		            <div th:replace="~{fragments/product-tile :: product-tile(${product})}"></div>
		        </th:block>
		    </div>
		</div>

        <!-- Empty state pour produits -->
        <div th:if="${#lists.isEmpty(products) && #lists.isEmpty(subCategories)}" class="text-center py-5">
            <i class="bi bi-inbox" style="font-size: 5rem; color: #cbd5e0;"></i>
            <h3 class="mt-3">Aucun produit dans cette catégorie</h3>
            <p class="text-muted">Cette catégorie ne contient pas encore de produits</p>
            <a href="/" class="btn btn-primary mt-3">
                <i class="bi bi-arrow-left"></i> Retour à l'Accueil
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 E-Commerce Store. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
