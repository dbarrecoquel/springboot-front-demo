<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Éditer Méthode de Paiement' : 'Créer Méthode de Paiement'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- En-tête -->
                <div class="mb-4">
                    <h2>
                        <i class="bi bi-credit-card"></i>
                        <span th:text="${isEdit} ? 'Éditer Méthode de Paiement' : 'Créer Méthode de Paiement'"></span>
                    </h2>
                    <a href="/payment-methods" class="btn btn-secondary">← Retour</a>
                </div>
                
                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <i class="bi bi-check-circle"></i> [[${success}]]
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <i class="bi bi-exclamation-circle"></i> [[${error}]]
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- Formulaire -->
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <span th:text="${isEdit} ? 'Édition' : 'Création'"></span>
                    </div>
                    <div class="card-body">
                        <form th:action="${isEdit} ? @{/payment-methods/{id}(id=${paymentMethod.id})} : @{/payment-methods}" 
                              method="post">
                            
                            <!-- Type de paiement -->
							<div class="mb-3">
							    <label for="type" class="form-label">Type de Paiement *</label>
							    
							    <!-- En création : select normal -->
							    <select th:if="!${isEdit}" class="form-select" id="type" name="type" required>
							        <option value="">-- Sélectionner un type --</option>
							        <option th:each="paymentType : ${paymentTypes}" 
							                th:value="${paymentType}"
							                th:text="${paymentType}">
							            Type
							        </option>
							    </select>
							    
							    <!-- En édition : affichage du type + input hidden -->
							    <div th:if="${isEdit}">
							        <div class="input-group">
							            <span class="input-group-text">
							                <i th:class="'bi ' + ${paymentMethod.icon}"></i>
							            </span>
							            <input type="text" class="form-control" readonly 
							                   th:value="${paymentMethod.type}">
							        </div>
							        <!-- ✅ IMPORTANT : input hidden pour envoyer la valeur au serveur -->
							        <input type="hidden" name="type" th:value="${paymentMethod.type}">
							    </div>
							    
							    <small class="text-muted">Le type ne peut pas être modifié après création</small>
							</div>
                            
                            <!-- Nom -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Nom Affiché *</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       th:value="${paymentMethod.name}" required
                                       placeholder="Ex: Paiement à la livraison">
                            </div>
                            
                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                          th:text="${paymentMethod.description}"
                                          placeholder="Description visible au client"></textarea>
                            </div>
                            
                            <!-- Icône -->
                            <div class="mb-3">
                                <label for="icon" class="form-label">Icône (Bootstrap Icon)</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i th:class="'bi ' + ${paymentMethod.icon ?: 'bi-credit-card'}"></i>
                                    </span>
                                    <input type="text" class="form-control" id="icon" name="icon" 
                                           th:value="${paymentMethod.icon ?: 'bi-credit-card'}"
                                           placeholder="Ex: bi-credit-card">
                                </div>
                                <small class="text-muted">
                                    Voir <a href="https://icons.getbootstrap.com/" target="_blank">Bootstrap Icons</a>
                                </small>
                            </div>
                            
                            <!-- Ordre d'affichage -->
                            <div class="mb-3">
                                <label for="displayOrder" class="form-label">Ordre d'Affichage</label>
                                <input type="number" class="form-control" id="displayOrder" name="displayOrder" 
                                       th:value="${paymentMethod.displayOrder ?: 0}" min="0">
                                <small class="text-muted">Les méthodes avec un numéro plus bas s'affichent en premier</small>
                            </div>
                            
                            <!-- Statut -->
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="enabled" name="enabled" 
                                           value="true" 
                                           th:checked="${paymentMethod.enabled != false}">
                                    <label class="form-check-label" for="enabled">
                                        <strong>Activée</strong>
                                    </label>
                                </div>
                                <small class="text-muted">Une méthode désactivée n'apparaît pas aux clients</small>
                            </div>
                            
                            <!-- Boutons -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i>
                                    <span th:text="${isEdit} ? 'Mettre à jour' : 'Créer'"></span>
                                </button>
                                <a href="/payment-methods" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <th:block th:if="${isEdit}">
                                    <a th:href="@{/payment-methods/{id}/delete(id=${paymentMethod.id})}" 
                                       class="btn btn-outline-danger ms-auto"
                                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette méthode ?')">
                                        <i class="bi bi-trash"></i> Supprimer
                                    </a>
                                </th:block>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
