<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isEdit} ? 'Modifier une méthode de livraison' : 'Créer une méthode de livraison'">
        Méthode de Livraison - BackOffice
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 th:text="${isEdit} ? 'Modifier la méthode de livraison' : 'Créer une méthode de livraison'">
                            Formulaire
                        </h3>
                    </div>
                    <div class="card-body">
                        <form th:action="${isEdit} ? @{/shipping-methods/update/{id}(id=${shippingMethod.id})} : @{/shipping-methods}" 
                              th:object="${shippingMethod}" 
                              method="post">
                            
                            <!-- Nom -->
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    <i class="bi bi-tag"></i> Nom de la méthode *
                                </label>
                                <input type="text" class="form-control" id="name" 
                                       th:field="*{name}" 
                                       placeholder="ex: Standard France, Express EU..." required>
                                <div class="text-danger" th:if="${#fields.hasErrors('name')}" 
                                     th:errors="*{name}"></div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    <i class="bi bi-text-left"></i> Description
                                </label>
                                <textarea class="form-control" id="description" 
                                          th:field="*{description}" 
                                          rows="3"
                                          placeholder="Description de la méthode de livraison..."></textarea>
                            </div>

                            <!-- Destination -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="destinationCountry" class="form-label">
                                        <i class="bi bi-globe"></i> Destination *
                                    </label>
                                    <select class="form-select" id="destinationCountry" 
                                            th:field="*{destinationCountry}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option value="France">France</option>
                                        <option value="Belgique">Belgique</option>
                                        <option value="Suisse">Suisse</option>
                                        <option value="Luxembourg">Luxembourg</option>
                                        <option value="Allemagne">Allemagne</option>
                                        <option value="Italie">Italie</option>
                                        <option value="Espagne">Espagne</option>
                                        <option value="Portugal">Portugal</option>
                                        <option value="EU">Union Européenne</option>
                                        <option value="ALL">Monde entier</option>
                                    </select>
                                    <div class="text-danger" th:if="${#fields.hasErrors('destinationCountry')}" 
                                         th:errors="*{destinationCountry}"></div>
                                    <small class="form-text text-muted">
                                        "EU" = Tous les pays de l'UE, "ALL" = Tous les pays
                                    </small>
                                </div>

                                <!-- Coût -->
                                <div class="col-md-6 mb-3">
                                    <label for="cost" class="form-label">
                                        <i class="bi bi-currency-euro"></i> Coût (€) *
                                    </label>
                                    <input type="number" step="0.01" min="0" 
                                           class="form-control" id="cost" 
                                           th:field="*{cost}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('cost')}" 
                                         th:errors="*{cost}"></div>
                                </div>
                            </div>

                            <!-- Délai et Statut -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="estimatedDays" class="form-label">
                                        <i class="bi bi-calendar-check"></i> Délai de livraison (jours)
                                    </label>
                                    <input type="number" min="0" 
                                           class="form-control" id="estimatedDays" 
                                           th:field="*{estimatedDays}" 
                                           placeholder="0">
                                    <small class="form-text text-muted">
                                        Nombre de jours estimé pour la livraison
                                    </small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="enabled" class="form-label">
                                        <i class="bi bi-toggle-on"></i> Statut
                                    </label>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" 
                                               id="enabled" th:field="*{enabled}">
                                        <label class="form-check-label" for="enabled">
                                            Méthode activée
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Boutons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="/shipping-methods" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
