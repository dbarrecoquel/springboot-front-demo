<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Méthodes de Livraison - BackOffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-truck"></i> Méthodes de Livraison</h2>
            <a href="/shipping-methods/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nouvelle méthode
            </a>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Table -->
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Destination</th>
                            <th>Coût</th>
                            <th>Délai (jours)</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="method : ${shippingMethods}">
                            <td th:text="${method.id}">1</td>
                            <td th:text="${method.name}">Standard</td>
                            <td th:text="${method.destinationCountry}">France</td>
                            <td th:text="${#numbers.formatDecimal(method.cost, 1, 2)} + ' €'">5.99 €</td>
                            <td th:text="${method.estimatedDays}">3</td>
                            <td>
                                <span th:if="${method.enabled}" class="badge bg-success">Activé</span>
                                <span th:unless="${method.enabled}" class="badge bg-secondary">Désactivé</span>
                            </td>
                            <td>
                                <a th:href="@{/shipping-methods/edit/{id}(id=${method.id})}" 
                                   class="btn btn-sm btn-warning">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/shipping-methods/toggle/{id}(id=${method.id})}" 
                                   class="btn btn-sm btn-info">
                                    <i class="bi bi-toggle-on"></i>
                                </a>
                                <a th:href="@{/shipping-methods/delete/{id}(id=${method.id})}" 
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Confirmer la suppression ?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
