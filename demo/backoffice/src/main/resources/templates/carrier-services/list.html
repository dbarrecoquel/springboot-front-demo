<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Services de transport - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        
        <div class="row mb-4">
            <div class="col-md-8">
                <h1><i class="bi bi-truck"></i> Services de transport</h1>
            </div>
            <div class="col-md-4 text-end">
                <a href="/backoffice/carrier-services/create" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouveau service
                </a>
            </div>
        </div>
        
        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> [[${success}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle"></i> [[${error}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Table -->
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Transporteur</th>
                    <th>Service</th>
                    <th>Jours de livraison</th>
                    <th>Jours de traitement</th>
                    <th>Cutoff</th>
                    <th>Coût</th>
                    <th>Gratuit à partir de</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="service : ${services}">
                    <td><strong th:text="${service.carrier.name}"></strong></td>
                    <td th:text="${service.name}"></td>
                    <td th:text="${service.deliveryDays} + ' jour(s)'"></td>
                    <td th:text="${service.processingDays} + ' jour(s)'"></td>
                    <td th:text="${service.cutoffTime}"></td>
                    <td>
                        <span th:if="${service.cost > 0}" th:text="'€' + ${service.cost}"></span>
                        <span th:unless="${service.cost > 0}" class="badge bg-success">GRATUIT</span>
                    </td>
                    <td th:text="'€' + ${service.freeShippingMinAmount}"></td>
                    <td>
                        <span th:if="${service.enabled}" class="badge bg-success">Actif</span>
                        <span th:unless="${service.enabled}" class="badge bg-danger">Inactif</span>
                    </td>
                    <td>
                        <a th:href="'/backoffice/carrier-services/' + ${service.id} + '/edit'" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="'/backoffice/carrier-services/' + ${service.id} + '/delete'" class="btn btn-sm btn-outline-danger" 
                           onclick="return confirm('Êtes-vous sûr ?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
