<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service de transport - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <div class="mb-4">
                    <h1 th:text="${service.id ? 'Modifier le service' : 'Nouveau service'}">
                        Service
                    </h1>
                </div>
                
                <form th:action="${service.id ? '/backoffice/carrier-services/' + service.id : '/backoffice/carrier-services'}" 
                      th:object="${service}" method="post" class="card p-4">
                    
                    <div class="mb-3">
                        <label for="carrier" class="form-label">Transporteur *</label>
                        <select class="form-select" id="carrier" th:field="*{carrier}" required>
                            <option value="">-- Choisir un transporteur --</option>
                            <option th:each="carrier : ${carriers}" th:value="${carrier.id}" th:text="${carrier.name}"></option>
                        </select>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Nom du service *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="code" class="form-label">Code *</label>
                            <input type="text" class="form-control" id="code" th:field="*{code}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="deliveryDays" class="form-label">Jours de livraison *</label>
                            <input type="number" class="form-control" id="deliveryDays" th:field="*{deliveryDays}" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="processingDays" class="form-label">Jours de traitement *</label>
                            <input type="number" class="form-control" id="processingDays" th:field="*{processingDays}" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="cutoffTime" class="form-label">Heure limite *</label>
                            <input type="time" class="form-control" id="cutoffTime" th:field="*{cutoffTime}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cost" class="form-label">Coût (€) *</label>
                            <input type="number" class="form-control" id="cost" th:field="*{cost}" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="freeShippingMinAmount" class="form-label">Livraison gratuite à partir de (€) *</label>
                            <input type="number" class="form-control" id="freeShippingMinAmount" th:field="*{freeShippingMinAmount}" step="0.01" min="0" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                            <label class="form-check-label" for="enabled">Actif</label>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="/backoffice/carrier-services" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Annuler
                        </a>
                    </div>
                    
                </form>
                
            </div>
        </div>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
