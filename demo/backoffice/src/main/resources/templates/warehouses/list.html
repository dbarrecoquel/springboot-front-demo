<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrepôts - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        
        <div class="row mb-4">
            <div class="col-md-8">
                <h1><i class="bi bi-building"></i> Entrepôts</h1>
            </div>
            <div class="col-md-4 text-end">
                <a href="/warehouses/create" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouvel entrepôt
                </a>
            </div>
        </div>
        
        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> [[${success}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle"></i> [[${error}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Table -->
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Code</th>
                    <th>Nom</th>
                    <th>Adresse</th>
                    <th>Ville</th>
                    <th>Pays</th>
                    <th>Région</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="warehouse : ${warehouses}">
                    <td><strong th:text="${warehouse.code}"></strong></td>
                    <td th:text="${warehouse.name}"></td>
                    <td th:text="${warehouse.street}"></td>
                    <td th:text="${warehouse.city}"></td>
                    <td th:text="${warehouse.country}"></td>
                    <td><span class="badge bg-info" th:text="${warehouse.region}"></span></td>
                    <td>
                        <span th:if="${warehouse.enabled}" class="badge bg-success">Actif</span>
                        <span th:unless="${warehouse.enabled}" class="badge bg-danger">Inactif</span>
                    </td>
                    <td>
                        <a th:href="'/warehouses/' + ${warehouse.id} + '/edit'" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="'/warehouses/' + ${warehouse.id} + '/delete'" class="btn btn-sm btn-outline-danger" 
                           onclick="return confirm('Êtes-vous sûr ?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
