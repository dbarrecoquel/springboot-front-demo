<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrepôt - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <div class="mb-4">
                    <h1 th:text="${warehouse != null and warehouse.id != null ? 'Modifier l entrepôt' : 'Nouvel entrepôt'}">
                        Entrepôt
                    </h1>
                </div>
                
                <form th:action="${warehouse != null and warehouse.id != null ? '/warehouses/' + warehouse.id : '/warehouses'}" 
                      th:object="${warehouse}" method="post" class="card p-4">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="code" class="form-label">Code *</label>
                            <input type="text" class="form-control" id="code" th:field="*{code}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Nom *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="street" class="form-label">Rue *</label>
                        <input type="text" class="form-control" id="street" th:field="*{street}" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="postalCode" class="form-label">Code postal *</label>
                            <input type="text" class="form-control" id="postalCode" th:field="*{postalCode}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="city" class="form-label">Ville *</label>
                            <input type="text" class="form-control" id="city" th:field="*{city}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="region" class="form-label">Région *</label>
                            <input type="text" class="form-control" id="region" th:field="*{region}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="country" class="form-label">Pays *</label>
                        <input type="text" class="form-control" id="country" th:field="*{country}" required>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                            <label class="form-check-label" for="enabled">Actif</label>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="/warehouses" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Annuler
                        </a>
                    </div>
                    
                </form>
                
            </div>
        </div>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
